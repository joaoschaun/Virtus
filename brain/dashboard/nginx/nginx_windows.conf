# =============================================================================
# VIRTUS Dashboard - Nginx Windows Configuration
# =============================================================================
# Subdomínio: dashboard.virtusinvestimentos.com.br
# Para uso com Cloudflare (SSL terminado no Cloudflare)
# =============================================================================

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log logs/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream para backend FastAPI
    upstream virtus_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # ==========================================================================
    # Servidor Principal - Dashboard VIRTUS
    # ==========================================================================
    server {
        listen 80;
        server_name dashboard.virtusinvestimentos.com.br;

        # Cloudflare Flexible SSL - aceita conexão HTTP do Cloudflare
        # O SSL é terminado no Cloudflare, então o servidor recebe HTTP

        # Caminho do frontend (build de produção)
        root C:/Users/Administrator/Desktop/Virtus/brain/dashboard/frontend/dist;
        index index.html;

        # Logs específicos do dashboard
        access_log logs/dashboard_access.log main;
        error_log  logs/dashboard_error.log warn;

        # Headers de segurança (alguns já adicionados pelo Cloudflare)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Real IP do Cloudflare
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        real_ip_header CF-Connecting-IP;

        # API Backend - DEVE VIR ANTES dos arquivos estáticos
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://virtus_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # CORS
            add_header Access-Control-Allow-Origin "https://virtusinvestimentos.com.br" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Cache para arquivos estáticos do FRONTEND (não API)
        location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # WebSocket
        location /ws {
            proxy_pass http://virtus_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Health check
        location /health {
            proxy_pass http://virtus_backend/health;
            proxy_set_header Host $host;
        }

        # Frontend SPA - fallback para index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Bloqueia arquivos sensíveis
        location ~ /\. {
            deny all;
        }

        location ~ \.(env|git|bak|log)$ {
            deny all;
        }
    }
}
