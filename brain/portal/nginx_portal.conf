    # ==========================================================================
    # Portal Publico - www.virtusinvestimentos.com.br (SEM LOGIN)
    # ==========================================================================
    server {
        listen 80;
        server_name www.virtusinvestimentos.com.br virtusinvestimentos.com.br;

        root C:/Users/Administrator/Desktop/Virtus/brain/portal/frontend/dist;
        index index.html;

        access_log logs/portal_access.log main;
        error_log  logs/portal_error.log warn;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 173.245.48.0/20;
        real_ip_header CF-Connecting-IP;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp4)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
