# ============================================================
# 💶 EURO BOT - Bot para EURUSD
# ============================================================

bot:
  id: "euro"
  name: "BRAIN Euro Bot"
  symbol: "EURUSD"
  enabled: true
  description: "Bot especializado em Euro - Scalping e Range Trading"

# Estratégias habilitadas
strategies:
  enabled:
    - "scalping"
    - "range_trading"
  
  # Configuração de Scalping
  scalping:
    enabled: true
    weight: 0.5
    
    entry:
      max_spread_pips: 1.5
      min_volatility_atr: 0.3
      max_volatility_atr: 2.0
      
    rsi:
      period: 14
      oversold: 30
      overbought: 70
      
    bollinger:
      period: 20
      std_dev: 2.0
      
    targets:
      take_profit_pips: 10
      stop_loss_pips: 7
      risk_reward_min: 1.4
  
  # Configuração de Range Trading
  range_trading:
    enabled: true
    weight: 0.5
    
    # Detecção de Range
    range_detection:
      min_bars: 20
      max_range_pips: 50
      atr_multiplier: 1.5
      
    # Suporte e Resistência
    sr_levels:
      lookback_bars: 100
      touch_threshold: 3
      
    targets:
      take_profit_pips: 20
      stop_loss_pips: 12
      risk_reward_min: 1.6

# Gestão de Risco do Bot
risk:
  max_positions: 1
  max_risk_per_trade: 0.015  # 1.5%
  max_daily_loss_usd: 150.0
  max_daily_trades: 8
  
  correlation:
    avoid_if_correlated_with: ["GBPUSD", "USDCHF"]
    correlation_threshold: 0.75

# Gestão de Posições
positions:
  trailing_stop:
    enabled: true
    activation_pips: 12
    trail_pips: 6
    
  breakeven:
    enabled: true
    activation_pips: 8
    lock_pips: 1
    
  partial_close:
    enabled: true
    levels:
      - pips: 15
        close_percent: 50

# Machine Learning
ml:
  enabled: true
  models:
    - "ensemble"
  min_confidence: 0.55
  weight_in_decision: 0.25

# Análise Técnica
analysis:
  timeframes:
    - "M5"
    - "M15"
    - "H1"
    
  smart_money:
    enabled: true
    order_blocks: true
    liquidity_zones: true
    fair_value_gaps: false
    
  manipulation_filter:
    enabled: true
    spike_threshold_pips: 3
    recovery_time_seconds: 20
    
  volume_profile:
    enabled: false

# Integração com Brain
brain:
  use_cache: true
  priority: "normal"
  
  data_sources:
    - "news"
    - "sentiment"
    - "calendar"
    - "macro"

# Horários de operação
schedule:
  preferred_hours:
    - start: "03:00"
      end: "12:00"
      timezone: "America/New_York"
      weight: 1.3  # London + NY overlap
    - start: "08:00"
      end: "11:00"
      timezone: "Europe/London"
      weight: 1.2
      
  avoid:
    - day: "friday"
      after: "18:00"
      reason: "Fim de semana"
