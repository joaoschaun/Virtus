api_keys:
  forexnews: "w4tne6w3psyvivompbkvvh2h7l5jxkzlhn24ku03"
  finnhub: "d4vle51r01qs25f0ri60d4vle51r01qs25f0ri6g"
  finazon: "830c05bb65994f99ae39629a0e9f8edffw"
  twelvedata: "a0f59fab7a354ce080c93b0b019e5e61"
  financialmodelingprep: "ZvAVZ4inPZ4mtTnJ4cuLSQYYSrLQcfkr"

# ============================================================================
# SÍMBOLOS ATIVOS
# ============================================================================
symbols:
  enabled:
    - "XAUUSD"   # Gold
    - "EURUSD"   # Euro
    - "GBPUSD"   # British Pound

# ============================================================================
# BOTS
# ============================================================================
bots:
  gold_bot:
    enabled: true
    config_file: "bots/gold.yaml"
    priority: "high"
  
  euro_bot:
    enabled: true
    config_file: "bots/euro.yaml"
    priority: "normal"
  
  gbp_bot:
    enabled: false  # Desabilitado inicialmente
    config_file: "bots/gbp.yaml"
    priority: "normal"

# ============================================================================
# RISCO GLOBAL
# ============================================================================
risk:
  max_total_positions: 6          # Máximo de posições simultâneas (todos os bots)
  max_daily_loss_usd: 500.0       # Perda máxima diária total
  max_drawdown_percent: 10.0      # Drawdown máximo permitido
  correlation_limit: 0.7          # Limite de correlação entre posições
  max_exposure_percent: 30.0      # Exposição máxima da conta

# ============================================================================
# ADVISOR / RELATÓRIOS
# ============================================================================
advisor:
  enabled: true
  language: "pt-BR"
  timezone: "America/Sao_Paulo"
  
  daily_briefing:
    enabled: true
    hour: 7
    minute: 30
    include_symbols: ["XAUUSD", "EURUSD", "GBPUSD"]
  
  news:
    summarize: true
    translate_to: "pt"
    max_per_briefing: 5
    min_impact: "high"
  
  sentiment:
    calculate_overall: true
    include_explanation: true

# ============================================================================
# ALERTAS
# ============================================================================
alerts:
  calendar_events: true           # Alertas de eventos econômicos
  regime_change: true             # Mudança de regime de mercado
  cot_extremes: true              # COT em níveis extremos
  correlation_breach: true        # Correlação acima do limite
  high_volatility: true           # Volatilidade acima do normal
  minutes_before_event: 15        # Minutos antes de evento importante

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: "INFO"                   # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "data/logs"
    max_size_mb: 10
    backup_count: 5

# ============================================================================
# DATABASE
# ============================================================================
database:
  type: "sqlite"                  # sqlite | postgresql
  path: "data/virtus.db"
  
# ============================================================================
# CACHE (REDIS)
# ============================================================================
cache:
  type: "memory"                  # memory | redis
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null

# ============================================================================
# HORÁRIOS DE OPERAÇÃO
# ============================================================================
trading_hours:
  enabled: true
  timezone: "America/Sao_Paulo"
  
  # Sessões de trading
  sessions:
    asian:
      start: "20:00"              # Hora local
      end: "05:00"
    london:
      start: "04:00"
      end: "12:00"
    newyork:
      start: "09:00"
      end: "17:00"
  
  # Dias de não operação
  skip_days:
    - "Saturday"
    - "Sunday"
  
  # Pausar antes de eventos de alto impacto
  pause_before_high_impact: true
  pause_minutes: 15
