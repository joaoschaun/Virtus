# ============================================================
# 🧠 BRAIN - Configuração Global
# ============================================================

system:
  name: "BRAIN"
  version: "1.0.0"
  environment: "development"  # development | staging | production
  debug: true

# Localização e timezone
localization:
  language: "pt-BR"
  timezone: "America/Sao_Paulo"
  date_format: "%d/%m/%Y"
  time_format: "%H:%M:%S"

# MetaTrader 5
mt5:
  path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  login: null  # Definir via variável de ambiente MT5_LOGIN
  password: null  # Definir via variável de ambiente MT5_PASSWORD
  server: null  # Definir via variável de ambiente MT5_SERVER
  timeout: 60000
  portable: false

# Bots ativos
bots:
  enabled:
    - "gold"
    - "euro"
    - "gbp"
  
  # Intervalo de trading em segundos
  trading_interval: 5
  
  # Intervalo de monitoramento de posições
  position_check_interval: 2

# Configuração global de risco
risk:
  max_total_positions: 6  # Máximo total (todos os bots)
  max_daily_loss_usd: 500.0  # Perda diária máxima total
  max_daily_loss_percent: 5.0  # Perda diária máxima em %
  max_drawdown_percent: 10.0  # Drawdown máximo
  correlation_limit: 0.7  # Limite de correlação entre posições
  
# Sessões de trading
sessions:
  london:
    start: "08:00"
    end: "17:00"
    timezone: "Europe/London"
  
  new_york:
    start: "08:00"
    end: "17:00"
    timezone: "America/New_York"
  
  tokyo:
    start: "09:00"
    end: "18:00"
    timezone: "Asia/Tokyo"

# Horários de pausa (evitar trading)
trading_blackout:
  # Eventos de alto impacto - pausar X minutos antes/depois
  high_impact_buffer_minutes: 15
  
  # Horários fixos de pausa
  daily_blackouts:
    - start: "23:55"
      end: "00:05"
      reason: "Rollover"
    - start: "12:55"
      end: "13:05"
      reason: "Almoço NY"

# Relatórios e notificações
reporting:
  daily_briefing:
    enabled: true
    hour: 7
    minute: 30
  
  weekly_report:
    enabled: true
    day: "monday"
    hour: 8
    minute: 0

# Alertas
alerts:
  calendar_events: true
  regime_change: true
  cot_extremes: true
  correlation_breach: true
  drawdown_warning: true
  drawdown_warning_threshold: 5.0  # %

# Logging
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  file_rotation: "daily"
  max_files: 30
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

# Database
database:
  type: "sqlite"  # sqlite | postgresql
  path: "data/brain.db"
  
# Cache Redis (opcional)
redis:
  enabled: false
  host: "localhost"
  port: 6379
  db: 0
  password: null
