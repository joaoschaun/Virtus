# ============================================================================
# VIRTUS - Brain Central Configuration
# Gerenciamento de APIs, Cache e Budget
# ============================================================================

brain:
  name: "VIRTUS Brain"
  version: "1.0.0"
  
  # Modo de operação
  mode: "hybrid"  # online | offline | hybrid

# ============================================================================
# CACHE COMPARTILHADO
# ============================================================================
cache:
  # TTL (Time To Live) em segundos
  ttl:
    news: 900              # 15 minutos
    sentiment: 600         # 10 minutos
    calendar: 3600         # 1 hora
    cot: 86400             # 1 dia
    macro: 3600            # 1 hora
    forex_rates: 60        # 1 minuto
    technical: 300         # 5 minutos
    eodhd_eod: 3600        # 1 hora (dados EOD)
    eodhd_intraday: 300    # 5 minutos (dados intraday)
    eodhd_live: 60         # 1 minuto (preços live)
    eodhd_fundamentals: 86400  # 24 horas
    eodhd_news: 900        # 15 minutos
  
  # Persistência
  persist_to_disk: true
  persist_path: "../data/brain/cache"
  
  # Limpeza
  cleanup_interval: 3600   # 1 hora
  max_entries: 10000

# ============================================================================
# BUDGET DE APIs (Controle de Chamadas)
# ============================================================================
budget:
  # Estado persistente
  state_file: "../data/brain/budget_state.json"
  reset_hour: 0            # Hora UTC para reset diário
  
  # Limites por provider
  providers:
    forexnews:
      monthly_limit: 5000
      daily_limit: 166      # 5000/30
      min_interval_ms: 1000 # 1 segundo entre chamadas
      priority: 1           # Maior prioridade
      
    eodhd:
      monthly_limit: 100000  # Free tier: Unlimited API calls
      daily_limit: 10000     # Rate limit: 100,000/day
      min_interval_ms: 500   # 0.5 segundo entre chamadas
      priority: 1            # Alta prioridade (dados completos)
      
    finnhub:
      monthly_limit: 30000  # 60 calls/min free tier
      daily_limit: 1000
      min_interval_ms: 1000
      priority: 2
      
    twelvedata:
      monthly_limit: 800    # Free tier: 800/day
      daily_limit: 800
      min_interval_ms: 1000
      priority: 3
      
    financialmodelingprep:
      monthly_limit: 250    # Free tier: 250/day
      daily_limit: 250
      min_interval_ms: 1000
      priority: 4
      
    finazon:
      monthly_limit: 500    # Backup
      daily_limit: 50
      min_interval_ms: 2000
      priority: 5

# ============================================================================
# PROVIDERS DE DADOS
# ============================================================================
providers:
  # Notícias
  news:
    primary: "eodhd"
    fallback: ["forexnews", "finnhub"]
    
  # Calendário Econômico
  calendar:
    primary: "eodhd"
    fallback: ["finnhub", "financialmodelingprep"]
    
  # Sentimento
  sentiment:
    primary: "eodhd"
    fallback: ["forexnews", "finnhub"]
    
  # COT (Commitment of Traders)
  cot:
    primary: "financialmodelingprep"
    fallback: []
    
  # Forex Rates
  forex_rates:
    primary: "eodhd"
    fallback: ["twelvedata", "finnhub", "finazon"]
    
  # Indicadores Técnicos
  technical:
    primary: "eodhd"
    fallback: ["twelvedata", "financialmodelingprep"]
  
  # Dados Históricos EOD
  eod_data:
    primary: "eodhd"
    fallback: ["twelvedata"]
  
  # Dados Fundamentais
  fundamentals:
    primary: "eodhd"
    fallback: ["financialmodelingprep"]
  
  # Dados Macro
  macro:
    primary: "eodhd"
    fallback: []

# ============================================================================
# EODHD API - Financial Data Provider
# https://eodhd.com/financial-apis/
# ============================================================================
eodhd:
  api_key: "${EODHD_API_KEY}"  # Ou configurar diretamente
  base_url: "https://eodhd.com/api"
  
  # Endpoints principais
  endpoints:
    # Market Data
    eod: "/eod/{symbol}"
    intraday: "/intraday/{symbol}"
    real_time: "/real-time/{symbol}"
    options: "/options/{symbol}"
    
    # Historical
    dividends: "/div/{symbol}"
    splits: "/splits/{symbol}"
    
    # Fundamental
    fundamentals: "/fundamentals/{symbol}"
    bulk_fundamentals: "/bulk-fundamentals/{exchange}"
    
    # Exchanges
    exchanges: "/exchanges-list/"
    symbols: "/exchange-symbol-list/{exchange}"
    search: "/search/{query}"
    
    # Calendar
    earnings: "/calendar/earnings"
    ipos: "/calendar/ipos"
    economic_events: "/economic-events"
    
    # News & Sentiment
    news: "/news"
    sentiment: "/sentiments"
    
    # Technical
    technical: "/technical/{symbol}"
    
    # Macro
    macro: "/macro-indicator/{country}"
  
  # Exchanges suportadas
  exchanges:
    stocks:
      - "US"       # USA
      - "LSE"      # London
      - "XETRA"    # Germany
      - "PA"       # Paris
      - "SA"       # Brazil (B3)
      - "TSE"      # Tokyo
    forex: "FOREX"
    crypto: "CC"
    indices: "INDX"
    commodities: "COMM"
  
  # Intervalos para intraday
  intervals:
    - "1m"
    - "5m"
    - "1h"
  
  # Indicadores técnicos disponíveis
  technical_indicators:
    - "sma"
    - "ema"
    - "wma"
    - "rsi"
    - "macd"
    - "bbands"
    - "stoch"
    - "atr"
    - "adx"
    - "cci"
    - "obv"
    - "sar"
    - "williams"
  
  # Mapeamento de símbolos Virtus -> EODHD
  symbol_mapping:
    # Forex
    XAUUSD: "XAUUSD.FOREX"
    EURUSD: "EURUSD.FOREX"
    GBPUSD: "GBPUSD.FOREX"
    USDJPY: "USDJPY.FOREX"
    AUDUSD: "AUDUSD.FOREX"
    USDCAD: "USDCAD.FOREX"
    USDCHF: "USDCHF.FOREX"
    NZDUSD: "NZDUSD.FOREX"
    
    # Crypto
    BTCUSD: "BTC-USD.CC"
    ETHUSD: "ETH-USD.CC"
    
    # Índices
    SPX: "GSPC.INDX"
    DJI: "DJI.INDX"
    NASDAQ: "IXIC.INDX"
    VIX: "VIX.INDX"
    DXY: "DX-Y.NYB"
  
  # Países para dados macro
  macro_countries:
    - "USA"
    - "BRA"
    - "GBR"
    - "DEU"
    - "JPN"
    - "CHN"
    - "EUR"
  
  # Indicadores macro disponíveis
  macro_indicators:
    - "gdp_growth_annual"
    - "inflation_consumer_prices_annual"
    - "real_interest_rate"
    - "unemployment_rate"
    - "current_account_balance"
    - "government_debt_to_gdp"
    - "population_total"
    - "gdp_current_usd"

# ============================================================================
# FOREXNEWS API
# ============================================================================
forexnews:
  base_url: "https://forexnewsapi.com/api/v1"
  endpoints:
    news: "/news"
    sentiment: "/sentiment"
    events: "/events"
    trending: "/trending"
  
  # Filtros padrão
  default_filters:
    min_sentiment: -1.0
    max_sentiment: 1.0
    sources: []            # Vazio = todas
    
  # Mapeamento de símbolos
  symbol_mapping:
    XAUUSD: ["XAU", "GOLD", "gold"]
    EURUSD: ["EUR", "EURUSD"]
    GBPUSD: ["GBP", "GBPUSD", "cable"]

# ============================================================================
# FINNHUB API
# ============================================================================
finnhub:
  base_url: "https://finnhub.io/api/v1"
  endpoints:
    market_news: "/news"
    company_news: "/company-news"
    forex_rates: "/forex/rates"
    forex_candles: "/forex/candle"
    calendar: "/calendar/economic"
    sentiment: "/news-sentiment"
  
  # Categorias de notícias
  news_categories:
    - "forex"
    - "general"
    - "crypto"
    - "merger"

# ============================================================================
# TWELVEDATA API
# ============================================================================
twelvedata:
  base_url: "https://api.twelvedata.com"
  endpoints:
    time_series: "/time_series"
    price: "/price"
    exchange_rate: "/exchange_rate"
    forex_pairs: "/forex_pairs"
    technical: "/technical_indicators"
    quote: "/quote"
  
  # Intervalos suportados
  intervals:
    - "1min"
    - "5min"
    - "15min"
    - "30min"
    - "1h"
    - "4h"
    - "1day"

# ============================================================================
# FINANCIALMODELINGPREP API
# ============================================================================
financialmodelingprep:
  base_url: "https://financialmodelingprep.com/api/v3"
  endpoints:
    forex_quote: "/quote"
    forex_list: "/fx"
    economic_calendar: "/economic_calendar"
    cot: "/cot"
    news: "/fmp/articles"

# ============================================================================
# FINAZON API (BACKUP)
# ============================================================================
finazon:
  base_url: "https://api.finazon.io/latest"
  endpoints:
    forex_tickers: "/finazon/forex/tickers"
    time_series: "/time_series"

# ============================================================================
# ANALYZERS (ANÁLISES DO BRAIN)
# ============================================================================
analyzers:
  news:
    enabled: true
    sentiment_threshold:
      bullish: 0.3
      bearish: -0.3
    importance_weight:
      high: 1.0
      medium: 0.6
      low: 0.3
    max_news_age_hours: 24
    
  sentiment:
    enabled: true
    sources:
      - news
      - social
      - institutional
    aggregation: "weighted_average"
    
  macro:
    enabled: true
    indicators:
      - "DXY"              # Dollar Index
      - "VIX"              # Volatility Index
      - "US10Y"            # Treasury 10Y
      - "SPX"              # S&P 500
    update_interval: 3600  # 1 hora
    
  correlation:
    enabled: true
    pairs:
      - ["XAUUSD", "DXY"]
      - ["EURUSD", "GBPUSD"]
      - ["XAUUSD", "EURUSD"]
    window: 20             # Período para cálculo
    alert_threshold: 0.8   # Alerta se correlação > 0.8

# ============================================================================
# TRADUÇÃO
# ============================================================================
translation:
  enabled: true
  target_language: "pt"
  provider: "internal"     # internal | google | deepl
  cache_translations: true
